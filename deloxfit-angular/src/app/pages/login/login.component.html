<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="display: flex; flex-direction: column; height: 100%; justify-content: center;">
    <div style="text-align: center; margin-bottom: 30px;">
      <h1>DeloxFit App</h1>
      <p>Bienvenido de nuevo</p>
    </div>

    <ion-item>
      <ion-input label="Email" labelPlacement="floating" type="email" [(ngModel)]="email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Contraseña" labelPlacement="floating" type="password" [(ngModel)]="password"></ion-input>
    </ion-item>
    
    <ion-button expand="block" class="ion-margin-top" (click)="login()" color="primary">Entrar</ion-button>
    <ion-button expand="block" fill="clear" routerLink="/register">¿No tienes cuenta? Regístrate</ion-button>
  </div>
</ion-content>

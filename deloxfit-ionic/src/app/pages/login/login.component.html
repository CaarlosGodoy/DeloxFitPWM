<ion-header>
  <ion-toolbar color="primary" mode="ios">
    <ion-title class="ion-text-center">Inicio de Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="text-align: center; margin-top: 40px; margin-bottom: 30px;">
    <img src="assets/logo.png" style="width: 150px; margin-bottom: 20px;" alt="Logo DeloxFit" />
    <h1>DeloxFit App</h1>
    <p>Bienvenido de nuevo</p>
  </div>

  <ion-list lines="full" style="background: transparent;">
    <ion-item>
      <ion-input label="Email" labelPlacement="floating" type="email" [(ngModel)]="email" placeholder="Introduce tu email"></ion-input>
    </ion-item>
    <ion-item class="ion-margin-top">
      <ion-input label="Contraseña" labelPlacement="floating" type="password" [(ngModel)]="password" placeholder="Introduce tu contraseña"></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" class="ion-margin-top" (click)="login()" color="primary" style="margin-top: 40px;">Entrar</ion-button>
  <ion-button expand="block" fill="clear" routerLink="/register">¿No tienes cuenta? Regístrate</ion-button>
</ion-content>

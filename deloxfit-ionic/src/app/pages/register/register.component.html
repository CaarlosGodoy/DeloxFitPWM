<ion-header>
  <ion-toolbar color="primary" mode="ios">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center">Registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="text-align: center; margin-bottom: 20px;">
    <img src="assets/logo.png" style="width: 100px; margin-bottom: 10px;" alt="Logo DeloxFit" />
    <p>Crea tu cuenta para empezar a usar la app.</p>
  </div>

  <ion-item>
    <ion-input label="Nombre" labelPlacement="floating" type="text" [(ngModel)]="nombre"
      placeholder="Introduce tu nombre"></ion-input>
  </ion-item>

  <ion-item>
    <ion-input label="Apellidos" labelPlacement="floating" type="text" [(ngModel)]="apellidos"
      placeholder="Introduce tus apellidos"></ion-input>
  </ion-item>

  <ion-item>
    <ion-input label="Email" labelPlacement="floating" type="email" [(ngModel)]="email"
      placeholder="Introduce tu email"></ion-input>
  </ion-item>

  <ion-item>
    <ion-input label="Contraseña" labelPlacement="floating" type="password" [(ngModel)]="password"
      placeholder="Crea una contraseña"></ion-input>
  </ion-item>

  <ion-item lines="none" style="margin-top: 30px;" class="ion-text-center">
    <div style="width: 100%; padding-top: 15px;">
      <ion-label>Foto de Perfil</ion-label>
      <div (click)="fileInput.click()"
        style="margin: 15px auto; width: 100px; height: 100px; border-radius: 50%; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #f9f9f9; cursor: pointer;">
        <ion-icon *ngIf="!previewUrl" name="camera-outline" style="font-size: 40px; color: #999;"></ion-icon>
        <img *ngIf="previewUrl" [src]="previewUrl" style="width: 100%; height: 100%; object-fit: cover;" />
      </div>
      <input #fileInput type="file" accept="image/*" (change)="onFileSelected($event)" style="display: none;" />
      <p style="font-size: 0.8rem; color: gray;">
        {{ selectedFile ? 'Foto seleccionada' : 'Toca el círculo para subir tu foto' }}
      </p>
    </div>
  </ion-item>

  <ion-button expand="block" class="ion-margin-top" (click)="register()">Registrarse</ion-button>
</ion-content>

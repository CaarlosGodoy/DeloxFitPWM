<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/favorites"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="item">
    <img [src]="item.imagen" style="width: 100%; height: 250px; object-fit: cover;" alt="Imagen característica"/>
    
    <div class="ion-padding">
      <h1>{{ item.nombre }}</h1>
      <p style="color: gray; font-size: 1.2rem;">
        <strong>Precio:</strong> {{ item.precio }}
      </p>
      
      <p style="margin-top: 20px; line-height: 1.5;">
        {{ item.descripcion }}
      </p>

      <ion-button expand="block" class="ion-margin-top" (click)="toggleFavorite()" [color]="isFavorite ? 'danger' : 'primary'" [fill]="isFavorite ? 'solid' : 'outline'">
        <ion-icon slot="start" [name]="isFavorite ? 'heart' : 'heart-outline'"></ion-icon>
        {{ isFavorite ? 'Quitar de Favoritos' : 'Añadir a Favoritos' }}
      </ion-button>
    </div>
  </div>

  <div *ngIf="!item" class="ion-padding ion-text-center" style="margin-top: 50px;">
    <ion-spinner></ion-spinner>
    <p>Cargando información...</p>
  </div>
</ion-content>

<ion-header>
  <ion-toolbar color="primary" mode="ios">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/favorites" text=""></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center">Detalle</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="item">
    <div style="text-align: center; margin-top: 20px;">
      <img [src]="item.imagen"
        style="width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 4px solid var(--ion-color-primary);"
        alt="Imagen característica" />
    </div>

    <div class="ion-padding">
      <h1>{{ item.nombre }}</h1>
      <p style="color: gray; font-size: 1.2rem;">
        <strong>Precio:</strong> {{ item.precio }}
      </p>

      <ion-button expand="block" class="ion-margin-top" (click)="toggleFavorite()"
        [color]="isFavorite ? 'danger' : 'primary'" [fill]="isFavorite ? 'solid' : 'outline'">
        <ion-icon slot="start" [name]="isFavorite ? 'heart' : 'heart-outline'"></ion-icon>
        {{ isFavorite ? 'Quitar de Favoritos' : 'Añadir a Favoritos' }}
      </ion-button>
    </div>
  </div>

  <div *ngIf="!item" class="ion-padding ion-text-center" style="margin-top: 50px;">
    <ion-spinner></ion-spinner>
    <p>Cargando información...</p>
  </div>
</ion-content>
